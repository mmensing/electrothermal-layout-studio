name: Validate source

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: pwsh

env:
  QT_QPA_PLATFORM: offscreen
  PYTHONUTF8: '1'
  MPLBACKEND: Agg

jobs:
  source-quality:
    name: source-quality
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Install hash-verified Windows wheels and local source
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-windows-py312.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-build-isolation --no-deps -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
      - name: Build and test source-patched Qt reference ownership
        run: python scripts/prepare_qt_runtime.py
      - name: Validate source and workflow publication contracts
        run: python scripts/check_publication_policy.py
      - name: Scan source, fixtures and embedded resources with redacted diagnostics
        id: privacy
        run: python scripts/audit_publication.py --root . --source --output artifacts/publication-audit.json
      - name: Preserve only a clean publication report
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clean-publication-audit
          path: artifacts/publication-audit.json
          if-no-files-found: error
          retention-days: 7
      - name: Check generated source and offline capability catalogs
        run: python scripts/generate_capability_docs.py --check
      - name: Lint maintained source and scripts
        run: python -m ruff check .
      - name: Run fast contracts and package policy
        run: python -m pytest -m "fast or packaging" --basetemp=.pytest_fast --junitxml=artifacts/pytest-fast.xml
      - name: Guard compact maps, results and example browser workflows
        run: python -m pytest tests/test_transient_ui.py::test_time_selection_updates_map_sampler_metrics_and_exports_without_mutating_run tests/test_resource_trust_gui.py::test_review_authorizes_current_edits_against_held_archive tests/test_example_library_browser.py tests/test_workflow_next_steps.py tests/test_capability_catalog.py tests/test_reader_error_ownership.py tests/test_acceptance_project_readiness.py tests/test_acceptance_save_lifecycle.py tests/test_gui_stack_workflow.py tests/test_workflow_clarity.py tests/test_multiport_gui.py tests/test_parasitic_workflow.py tests/test_history_loading.py tests/test_gui_fixture_isolation.py tests/test_history_opening.py tests/test_project_opening.py::test_declined_external_resource_review_keeps_document_camera_and_history tests/test_release_workflow_smoke.py tests/test_shared_power_workbench.py tests/test_typed_scenario_editor.py tests/test_layout_editor.py::test_acceptance_invalid_mouse_drag_crosses_edge_at_compact_camera tests/test_qt_reference_lifetime.py --basetemp=.pytest_compact --junitxml=artifacts/pytest-compact.xml
      - name: Exercise public CLI
        run: |
          python -m etlayout --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m etlayout capabilities
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m etlayout inspect examples/E1_straight.oas
      - name: Retain owner-built Qt runtime and preferred source
        if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.actor == 'mmensing' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qt-runtime-source-candidate
          path: |
            artifacts/shiboken-runtime/shiboken6-6.12.0+etlayout.1-cp310-abi3-win_amd64.whl
            artifacts/shiboken-runtime/preferred-source.zip
            artifacts/shiboken-runtime/BUILD_PROVENANCE.json
            artifacts/shiboken-runtime/regression.xml
            artifacts/shiboken-runtime/pytest-installed.xml
          if-no-files-found: error
          retention-days: 7
      - name: Retain explicit Qt build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qt-runtime-build-diagnostics
          path: build/shiboken-runtime/command-*.log
          if-no-files-found: warn
          retention-days: 7
      - name: Summarize test costs without changing selection or results
        if: always()
        run: python scripts/summarize_test_timings.py --report fast=artifacts/pytest-fast.xml --report compact=artifacts/pytest-compact.xml --output artifacts/test-timings-source-quality.json --github-summary
      - name: Retain bounded fast-test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-quality
          path: artifacts/pytest-fast.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Retain bounded compact-workflow evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compact-transient-workflow
          path: |
            artifacts/pytest-compact.xml
            artifacts/test-timings-source-quality.json
          if-no-files-found: warn
          retention-days: 7

  scientific-regression:
    name: scientific-regression
    runs-on: windows-2025
    timeout-minutes: 30
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Classify actual changed paths; unknown scope requires numerical checks
        id: scope
        env:
          ETLAYOUT_BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
          ETLAYOUT_EVENT_NAME: ${{ github.event_name }}
        run: python scripts/ci_scientific_scope.py
      - name: Install hash-verified Windows wheels and local source
        if: steps.scope.outputs.required == 'true' && github.event_name == 'pull_request'
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-windows-py312.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-build-isolation --no-deps -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
      - name: Build and test source-patched Qt reference ownership
        if: steps.scope.outputs.required == 'true' && github.event_name == 'pull_request'
        run: python scripts/prepare_qt_runtime.py
      - name: Require actual numerical regressions for scientific pull requests
        if: steps.scope.outputs.required == 'true' && github.event_name == 'pull_request'
        run: python -m pytest -m numerical --basetemp=.pytest_scientific --junitxml=artifacts/pytest-scientific.xml
      - name: Document lightweight scope or downstream complete validation
        if: steps.scope.outputs.required != 'true' || github.event_name != 'pull_request'
        run: Write-Output 'Documentation-only PRs retain the stable check; scientific main/owner runs use the dependent complete source and desktop jobs.'
      - name: Summarize numerical test costs
        if: always() && steps.scope.outputs.required == 'true' && github.event_name == 'pull_request'
        run: python scripts/summarize_test_timings.py --report numerical=artifacts/pytest-scientific.xml --output artifacts/test-timings-scientific.json --github-summary
      - name: Retain explicit scientific scope and test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scientific-regression
          path: |
            artifacts/scientific-scope.json
            artifacts/pytest-scientific.xml
            artifacts/test-timings-scientific.json
          if-no-files-found: warn
          retention-days: 7

  windows-tests:
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.actor == 'mmensing')) && needs.scientific-regression.outputs.required == 'true'
    needs: [source-quality, scientific-regression]
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Install hash-verified Windows wheels and local source
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-windows-py312.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-build-isolation --no-deps -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
      - name: Build and test source-patched Qt reference ownership
        run: python scripts/prepare_qt_runtime.py
      - name: Run complete source collection including spawned-worker coverage
        run: python -m coverage run -m pytest --basetemp=.pytest_full --junitxml=artifacts/pytest-full.xml
      - name: Summarize complete collection costs
        if: always()
        run: python scripts/summarize_test_timings.py --report complete=artifacts/pytest-full.xml --output artifacts/test-timings-full.json --github-summary
      - name: Report separate statement and branch coverage
        if: always()
        run: |
          python -m coverage combine
          python -m coverage report
          python -m coverage json -o artifacts/coverage.json
          python -m coverage xml -o artifacts/coverage.xml
      - name: Exercise real CLI and handbook calculations
        run: |
          python -m etlayout solve examples/E1_straight.etl --no-plots --output artifacts/ci-E1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python docs/handbook/verify_walkthroughs.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python docs/handbook/verify_transient_walkthroughs.py
      - name: Validate exact extended-example nominal projects and portable formats
        run: python scripts/verify_extended_examples.py --output artifacts/extended-examples
      - name: Retain numerical verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-source-validation
          path: |
            artifacts/pytest-full.xml
            artifacts/test-timings-full.json
            artifacts/coverage.json
            artifacts/coverage.xml
            artifacts/extended-examples/receipt.json
            artifacts/extended-examples/*/receipt.json
          if-no-files-found: warn
          retention-days: 7

  windows-desktop:
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.actor == 'mmensing')) && needs.scientific-regression.outputs.required == 'true'
    needs: [source-quality, scientific-regression]
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Install hash-verified Windows wheels and local source
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-windows-py312.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-build-isolation --no-deps -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
      - name: Build and test source-patched Qt reference ownership
        run: python scripts/prepare_qt_runtime.py
      - name: Exercise real workflow journeys with synthetic projects
        run: |
          $journeys = @('gui_acceptance', 'visualization_workbench_acceptance', 'workflow_ui_acceptance', 'reporting_performance_acceptance', 'transient_acceptance', 'transient_workflow_acceptance', 'power_workflow_acceptance', 'guided_workflow_acceptance', 'local_refinement_acceptance', 'power_examples_desktop_acceptance', 'layout_editor_acceptance', 'readability_acceptance')
          $journeys += 'workspace_panels_acceptance', 'workflow_guidance_acceptance'
          $failedJourneys = @()
          $journeyTimings = @()
          $journeys += 'export_acceptance', 'archive_history_acceptance', 'scientific_lifecycle_acceptance'
          foreach ($journey in $journeys) {
            $journeyClock = [Diagnostics.Stopwatch]::StartNew()
            python "scripts/$journey.py" --offscreen --output "artifacts/desktop-$journey"
            $journeyExit = $LASTEXITCODE
            $journeyClock.Stop()
            $journeyTimings += @{ journey = $journey; seconds = $journeyClock.Elapsed.TotalSeconds; exit_code = $journeyExit }
            $journeyTimings | ConvertTo-Json | Set-Content -LiteralPath artifacts/desktop-journey-timings.json -Encoding utf8
            if ($journeyExit -ne 0) { $failedJourneys += $journey }
          }
          if ($failedJourneys.Count -gt 0) { throw "Failed desktop journeys: $($failedJourneys -join ', ')" }
      - name: Exercise the expanded catalog and representative complete workflows
        run: |
          $catalogClock = [Diagnostics.Stopwatch]::StartNew()
          python scripts/power_examples_desktop_acceptance.py --offscreen --catalog --solve --workflow E25 E33 E36 E39 --output artifacts/desktop-extended-examples
          $catalogExit = $LASTEXITCODE
          $catalogClock.Stop()
          @{ journey = 'extended-example-workflows'; seconds = $catalogClock.Elapsed.TotalSeconds; exit_code = $catalogExit } | ConvertTo-Json | Set-Content -LiteralPath artifacts/desktop-catalog-timing.json -Encoding utf8
          exit $catalogExit
      - name: Retain readable desktop evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-desktop-validation
          path: |
            artifacts/desktop-*/*.json
            artifacts/desktop-journey-timings.json
            artifacts/desktop-catalog-timing.json
            artifacts/desktop-*/**/receipt.json
            artifacts/desktop-*/**/font-verification.json
            artifacts/desktop-*/**/*.png
            artifacts/desktop-scientific_lifecycle_acceptance/native-faults.log
          if-no-files-found: warn
          retention-days: 7
